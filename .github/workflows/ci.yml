name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commerce:commerce@localhost:5432/commerce?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: gofmt -w $(find apps packages -name '*.go')
      - run: git diff --exit-code
      - run: go run ./cmd/openapi-gen
      - run: go test ./internal/openapi
      - run: git diff --exit-code -- docs/api
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f docker/go-app.Dockerfile --build-arg APP_PATH=./apps/admin-api -t commerce-admin-api:ci .
      - run: docker build -f docker/go-app.Dockerfile --build-arg APP_PATH=./apps/workers/general-worker -t commerce-general-worker:ci .
      - run: docker build -f docker/web-app.Dockerfile --build-arg WORKSPACE=@commerce/admin-web -t commerce-admin-web:ci .
      - run: docker build -f docker/web-app.Dockerfile --build-arg WORKSPACE=@commerce/storefront-web -t commerce-storefront-web:ci .
      - run: test -f migrations/000001_event_delivery_foundation.up.sql
      - run: test -f migrations/000001_event_delivery_foundation.down.sql

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: go list -m all
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
